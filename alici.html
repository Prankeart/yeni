<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alıcı — Optik Transfer QR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141d;color:#eef2ff;font:16px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:14px 18px;background:#1b2332;display:flex;justify-content:space-between;align-items:center}a{color:#7dd3fc;text-decoration:none}.controls{padding:14px;display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 14px;background:#7dd3fc;color:#07111c;font-weight:700;font-size:1rem;flex:1}button.secondary{background:#354158;color:#fff}button:disabled{opacity:.4}.camera{position:relative;background:#000;flex:1;min-height:260px;display:grid;place-items:center;overflow:hidden}video{width:100%;height:100%;object-fit:cover;position:absolute} .aim{position:absolute;width:min(75vw,360px);height:min(75vw,360px);border:3px solid #7dd3fc;border-radius:16px;box-shadow:0 0 0 999px #0005;pointer-events:none}.status{padding:12px 16px;background:#1b2332;color:#c5cde0;font-size:.9rem}textarea{margin:12px;width:calc(100% - 24px);min-height:140px;background:#0d1119;color:#fff;border:1px solid #3b465d;border-radius:10px;padding:12px;font:inherit}small{color:#aab5cc;padding:0 14px 12px}
</style></head><body><header><b>▣ Alıcı</b><a href="index.html">← Ana sayfa</a></header>
<div class="controls"><button id="start">📷 Kamerayı aç</button><button id="stop" class="secondary" disabled>Durdur</button><button id="reset" class="secondary">Sıfırla</button></div>
<div class="camera"><video id="video" playsinline muted></video><div class="aim"></div></div>
<div class="status" id="status">Hazır. Kamerayı aç ve vericideki QR kodunu çerçeveye al.</div><small id="progress">Toplanan: 0 QR</small><textarea id="result" placeholder="Alınan metin burada görünecek..." readonly></textarea>
<script>
const $=id=>document.getElementById(id);let stream=null,detector=null,running=false,raf=0,parts=new Map(),currentId=null,total=null,lastRaw='',lastAt=0,decodedText='';
async function start(){if(!('BarcodeDetector'in window)){ $('status').textContent='Bu tarayıcıda QR tarama desteği yok. Android Chrome güncel sürümünü dene.';return}try{detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});$('video').srcObject=stream;await $('video').play();running=true;$('start').disabled=true;$('stop').disabled=false;$('status').textContent='Kamera açık. QR kodunu ortadaki çerçeveye al.';scan()}catch(e){$('status').textContent='Kamera açılamadı: '+e.message}}
async function scan(){if(!running)return;try{const v=$('video');if(v.readyState>=2){const codes=await detector.detect(v);if(codes.length){const raw=codes[0].rawValue;if(raw!==lastRaw||Date.now()-lastAt>700){lastRaw=raw;lastAt=Date.now();accept(raw)}}}}catch(e){}raf=requestAnimationFrame(scan)}
function accept(raw){let o;try{o=JSON.parse(raw)}catch{return}if(!o||o.p!=='OTQR1'||typeof o.id!=='string'||!Number.isInteger(o.i)||!Number.isInteger(o.n)||typeof o.d!=='string'||o.n<1||o.n>1000||o.i<0||o.i>=o.n)return;if(currentId!==o.id){currentId=o.id;total=o.n;parts.clear();$('result').value='';decodedText=''}if(total!==o.n)return;if(!parts.has(o.i))parts.set(o.i,o.d);$('progress').textContent=`Aktarım: ${o.id} · Toplanan ${parts.size}/${total} QR`;if(parts.size===total){try{let payload='';for(let i=0;i<total;i++){if(!parts.has(i))return;payload+=parts.get(i)}const binary=atob(payload);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));decodedText=new TextDecoder('utf-8',{fatal:true}).decode(bytes);$('result').value=decodedText;$('status').textContent='✅ Aktarım tamamlandı! Metin başarıyla çözüldü.'}catch(e){$('status').textContent='Veri birleştirildi ama çözülemedi. QR boyutunu küçültüp tekrar dene.'}}else $('status').textContent=`QR ${o.i+1}/${o.n} alındı.`}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('start').disabled=false;$('stop').disabled=true}
function reset(){parts.clear();currentId=null;total=null;lastRaw='';lastAt=0;$('result').value='';$('progress').textContent='Toplanan: 0 QR';$('status').textContent='Sıfırlandı. Kamerayı açıp tekrar tara.'}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=reset;window.addEventListener('pagehide',stop);
</script></body></html>
