<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verici — Optik Transfer QR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141d;color:#eef2ff;font:16px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:14px 18px;background:#1b2332;display:flex;justify-content:space-between;align-items:center}a{color:#7dd3fc;text-decoration:none}.controls{padding:14px;display:grid;gap:10px}textarea,input{width:100%;background:#0d1119;color:#fff;border:1px solid #3b465d;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:12px 14px;background:#7dd3fc;color:#07111c;font-weight:700;font-size:1rem}button.secondary{background:#354158;color:#fff}button:disabled{opacity:.4}.btns{display:flex;gap:8px}.btns button{flex:1}.stage{flex:1;display:grid;place-items:center;background:#fff;padding:14px;min-height:300px}#qrcode{width:min(82vw,420px);height:min(82vw,420px);display:grid;place-items:center}#qrcode img,#qrcode canvas{width:100%!important;height:100%!important;image-rendering:pixelated}.status{padding:12px 16px;background:#1b2332;color:#c5cde0;font-size:.9rem}small{color:#aab5cc}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><header><b>↗ Verici</b><a href="index.html">← Ana sayfa</a></header>
<div class="controls"><label for="message">Gönderilecek metin</label><textarea id="message" rows="4" maxlength="10000">Merhaba! QR kodlarıyla optik veri aktarımı testi.</textarea><label for="chunk">Her QR içindeki karakter sayısı (küçük = daha kolay okunur)</label><input id="chunk" type="number" min="100" max="1200" step="50" value="350"><div class="btns"><button id="prepare">QR'ları hazırla</button><button id="start" disabled>▶ Başlat</button><button id="stop" class="secondary" disabled>Durdur</button></div><small>Telefonları karşı karşıya tut. Otomatik geçiş yavaş tutulur; istersen durdurup tek tek de ilerleyebilirsin.</small></div>
<div class="stage"><div id="qrcode">QR burada görünecek</div></div><div class="status" id="status">Hazır — önce QR'ları hazırla.</div>
<script>
const $=id=>document.getElementById(id);let frames=[],idx=0,timer=null;
function stop(){if(timer)clearInterval(timer);timer=null;$('start').disabled=false;$('stop').disabled=true}
function render(){const box=$('qrcode');box.innerHTML='';new QRCode(box,{text:frames[idx],width:420,height:420,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});$('status').textContent=`QR ${idx+1}/${frames.length} · Alıcıda da aynı aktarım kimliği görünmeli.`}
$('prepare').onclick=()=>{stop();if(!window.QRCode){$('status').textContent='QR kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip sayfayı yenile.';return}const text=$('message').value;if(!text){$('status').textContent='Önce bir metin yaz.';return}const size=Math.max(100,Math.min(1200,Number($('chunk').value)||350));const bytes=new TextEncoder().encode(text);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);const payload=btoa(binary);const id=Math.random().toString(36).slice(2,8);const chunks=[];for(let i=0;i<payload.length;i+=size)chunks.push(payload.slice(i,i+size));frames=chunks.map((data,i)=>JSON.stringify({p:'OTQR1',id,i,n:chunks.length,d:data}));idx=0;render();$('start').disabled=false;$('status').textContent=`Hazır: ${frames.length} QR · ${bytes.length} bayt · aktarım kodu ${id}. Alıcıda kamerayı aç.`};
$('start').onclick=()=>{if(!frames.length)return;stop();render();timer=setInterval(()=>{idx=(idx+1)%frames.length;render()},1800);$('start').disabled=true;$('stop').disabled=false};
$('stop').onclick=stop;
</script></body></html>
